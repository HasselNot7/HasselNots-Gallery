<script>
        // Simple script to handle marker hover interactions for the popup
        document.addEventListener('DOMContentLoaded', () => {
            const markers = document.querySelectorAll('.map-marker');
            const popup = document.getElementById('photo-popup');
            
            // Mock data for markers
            const markerData = {
                'marker-1': { loc: 'Reykjavik, IS', coord: '64.1466° N, 21.9426° W', cam: 'Hasselblad X2D', lens: '55mm' },
                'marker-2': { loc: 'London, UK', coord: '51.5074° N, 0.1278° W', cam: 'Leica Q3', lens: '28mm' },
                'marker-3': { loc: 'Tokyo, JP', coord: '35.6762° N, 139.6503° E', cam: 'Sony A7RV', lens: '35mm' },
                'marker-4': { loc: 'Sydney, AU', coord: '33.8688° S, 151.2093° E', cam: 'Leica M11', lens: '50mm' }
            };

            markers.forEach(marker => {
                marker.addEventListener('mouseenter', (e) => {
                    const id = marker.id;
                    const data = markerData[id];
                    
                    if(data) {
                        document.getElementById('popup-loc').textContent = data.loc;
                        document.getElementById('popup-coord').textContent = data.coord;
                        document.getElementById('popup-cam').textContent = data.cam;
                        document.getElementById('popup-lens').textContent = data.lens;
                        
                        // Position popup above marker
                        const rect = marker.getBoundingClientRect();
                        popup.style.left = `${rect.left + rect.width / 2}px`;
                        popup.style.top = `${rect.top}px`;
                        
                        popup.classList.remove('hidden');
                        // slight delay for animation
                        setTimeout(() => popup.classList.remove('opacity-0'), 10);
                    }
                });

                marker.addEventListener('mouseleave', () => {
                    popup.classList.add('opacity-0');
                    setTimeout(() => popup.classList.add('hidden'), 200); // match transition duration
                });
            });
        });
    </script>
