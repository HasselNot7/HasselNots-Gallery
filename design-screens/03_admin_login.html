<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - LENS &amp; LIGHT</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {

                        "tertiary-container": "#005514",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "background": "#f8faf8",
                        "error": "#ba1a1a",
                        "surface-bright": "#f8faf8",
                        "secondary-fixed": "#b4f1c1",
                        "outline": "#727973",
                        "on-surface": "#191c1b",
                        "on-primary-container": "#9ac0aa",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#eff1ef",
                        "mint-accent": "#D1E7D3",
                        "on-secondary-fixed-variant": "#16512e",
                        "secondary-fixed-dim": "#98d4a6",
                        "tertiary": "#003b0b",
                        "surface-container": "#eceeec",
                        "surface-container-high": "#e6e9e7",
                        "surface-container-low": "#f2f4f2",
                        "on-secondary-container": "#366e47",
                        "on-tertiary-fixed": "#002204",
                        "on-error": "#ffffff",
                        "outline-variant": "#c1c8c2",
                        "surface-container-highest": "#e1e3e1",
                        "on-primary-fixed": "#002113",
                        "on-tertiary-container": "#69cd6a",
                        "secondary-container": "#b1eebe",
                        "on-background": "#191c1b",
                        "on-secondary-fixed": "#00210d",
                        "surface-dim": "#d8dad9",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#316944",
                        "surface-tint": "#436653",
                        "on-surface-variant": "#414844",
                        "deep-charcoal": "#1A1C1A",

                        "surface": "#f8faf8",

                        "on-tertiary-fixed-variant": "#005313",
                        "primary-container": "#2d4f3e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "section-gap": "120px",
                        "grid-margin": "40px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Hanken Grotesk"],
                        "metadata-sm": ["JetBrains Mono"],
                        "label-caps": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {

                        "label-caps": ["10px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700" }],

<style>
        .glass-panel {
            background: rgba(248, 250, 248, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle, #E2E8E2);
        }
        .grid-pattern {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(226, 232, 226, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(226, 232, 226, 0.5) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-mint-accent selection:text-primary">
<main class="flex-grow relative flex items-center justify-center overflow-hidden py-section-gap px-grid-margin grid-pattern">
<div class="absolute inset-0 z-0 bg-gradient-to-br from-transparent to-mint-accent/20 pointer-events-none"></div>
<div class="relative z-10 w-full max-w-md">
<div class="glass-panel p-10 flex flex-col items-center border border-border-subtle shadow-[0_20px_40px_rgba(45,79,62,0.05)]">
<div class="mb-8 flex flex-col items-center">
<span class="material-symbols-outlined text-4xl text-primary mb-4" style="font-variation-settings: 'FILL' 0;">lock</span>
<h1 class="font-headline-lg text-headline-lg text-primary text-center">LENS &amp; LIGHT</h1>
<div class="mt-4 bg-mint-accent/50 px-3 py-1 border border-primary/10">
<span class="font-label-caps text-label-caps text-primary tracking-widest uppercase">Protected Area</span>
</div>
</div>
<form class="w-full space-y-6">
<div class="space-y-1">
<label class="font-metadata-sm text-metadata-sm text-on-surface-variant block uppercase" for="username">Username</label>
<input class="w-full bg-transparent border-0 border-b border-border-subtle focus:border-primary focus:ring-0 px-0 py-2 font-metadata-sm text-on-surface transition-colors placeholder:text-outline-variant" id="username" name="username" placeholder="admin@lensandlight.com" required="" type="text"/>
</div>
<div class="space-y-1">
<label class="font-metadata-sm text-metadata-sm text-on-surface-variant block uppercase" for="password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-border-subtle focus:border-primary focus:ring-0 px-0 py-2 font-metadata-sm text-on-surface transition-colors placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary font-label-caps text-label-caps py-4 mt-8 hover:bg-primary-container transition-all duration-300 flex items-center justify-center gap-2 group" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
</div>
</div>
</main>
</body></html>
